name: Testar conferencia antiduplicata (nao publica)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Procurar os ultimos publicados no perfil, pela legenda
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: ${{ vars.IG_ACCOUNT_ID }}
        run: python3 scripts/testar_conferencia.py
