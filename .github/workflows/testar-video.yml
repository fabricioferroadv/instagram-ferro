name: Testar video (nao publica)

on:
  workflow_dispatch:
    inputs:
      arquivo:
        description: "Caminho do vídeo no repositório"
        default: "midia/_teste/teste.mp4"

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Criar contêiner de Reel e esperar (sem publicar)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: ${{ vars.IG_ACCOUNT_ID }}
        run: python3 scripts/testar_video.py "${{ inputs.arquivo }}"
